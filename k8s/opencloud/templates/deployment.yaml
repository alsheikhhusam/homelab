apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencloud.fullname" . }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opencloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "opencloud.labels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "opencloud init || true; opencloud server"]
          env:
            - name: OC_URL
              value: {{ .Values.url | quote }}
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminPassword.existingSecret }}
                  key: {{ .Values.adminPassword.key }}
            - name: OC_ADD_RUN_SERVICES
              value: collaboration
            - name: COLLABORATION_WOPI_SRC
              value: {{ .Values.url | quote }}
            - name: COLLABORATION_APP_NAME
              value: {{ .Values.office.name | quote }}
            - name: COLLABORATION_APP_PRODUCT
              value: OnlyOffice
            - name: COLLABORATION_APP_ADDR
              value: {{ .Values.office.internalUrl | quote }}
            - name: COLLABORATION_APP_ICON
              value: {{ .Values.office.icon | quote }}
            - name: COLLABORATION_APP_PROOF_DISABLE
              value: "true"
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/opencloud/csp.yaml
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: data
              mountPath: /var/lib/opencloud
              subPath: data
            - name: config
              mountPath: /etc/opencloud/csp.yaml
              subPath: csp.yaml
            - name: config
              mountPath: /etc/opencloud/app-registry.yaml
              subPath: app-registry.yaml
      volumes:
        - name: config
          configMap:
            name: {{ include "opencloud.fullname" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "opencloud.fullname" . }}-data
