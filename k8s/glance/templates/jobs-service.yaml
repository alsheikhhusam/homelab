{{- if .Values.jobs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "glance.fullname" . }}-jobs
  labels:
    {{- include "glance.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.jobs.port }}
      targetPort: {{ .Values.jobs.port }}
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ include "glance.fullname" . }}-jobs
  labels:
    {{- include "glance.labels" . | nindent 4 }}
    kubernetes.io/service-name: {{ include "glance.fullname" . }}-jobs
    endpointslice.kubernetes.io/managed-by: helm
addressType: IPv4
ports:
  - name: http
    port: {{ .Values.jobs.port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .Values.jobs.hostIP | quote }}
{{- end }}
